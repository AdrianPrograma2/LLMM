<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agregar imagen con DOM</title>
</head>
<body>

  <h2>Agregar imagen a un div con JavaScript y DOM</h2>

  <div id="contenedorImagen" style="border:1px solid #ccc; width:300px; height:200px;"></div>

  <button id="btnAgregar">Agregar Imagen</button>

  <script>
    const boton = document.getElementById("btnAgregar");
    const contenedor = document.getElementById("contenedorImagen");

    boton.addEventListener("click", () => {
      const img = document.createElement("img");

      img.src = "https://via.placeholder.com/300x200.png?text=Imagen+Ejemplo";
      img.alt = "Imagen ejemplo";
      img.style.width = "100%";
      img.style.height = "auto";

      contenedor.appendChild(img);

      boton.disabled = true;
    });
  </script>

</body>
</html>
