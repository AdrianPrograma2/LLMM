<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Borrar elementos de una lista</title>
</head>
<body>

  <h2>Lista con opción para borrar elementos</h2>

  <ul id="miLista">
    <li>Elemento 1</li>
    <li>Elemento 2</li>
    <li>Elemento 3</li>
    <li>Elemento 4</li>
  </ul>

  <button onclick="borrarUltimo()">Borrar último elemento</button>

  <script>
    function borrarUltimo() {
      var lista = document.getElementById("miLista");
      var ultimoElemento = lista.lastElementChild;

      if (ultimoElemento) {
        lista.removeChild(ultimoElemento);
      } else {
        alert("No quedan elementos para borrar.");
      }
    }
  </script>

</body>
</html>
