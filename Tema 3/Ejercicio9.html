<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Temperature Converter</title>
  <script>
    function toCelsius(f) {
      return ((5 / 9) * (f - 32)).toFixed(2);
    }

    function toFahrenheit(c) {
      return ((c * 9 / 5) + 32).toFixed(2);
    }

    function convertirAFahrenheit() {
      let c = parseFloat(document.getElementById("tbc").value);
      if (!isNaN(c)) {
        let f = toFahrenheit(c);
        document.getElementById("tbf").value = f;
      } else {
        alert("Introduce un valor numérico en Celsius.");
      }
    }

    function convertirACelsius() {
      let f = parseFloat(document.getElementById("tbf").value);
      if (!isNaN(f)) {
        let c = toCelsius(f);
        document.getElementById("tbc").value = c;
      } else {
        alert("Introduce un valor numérico en Fahrenheit.");
      }
    }
  </script>
</head>
<body>

  <h2>Temperature Converter</h2>

  <p>Introduce un valor y pulsa el botón correspondiente:</p>

  <label for="tbf">Fahrenheit:</label>
  <input type="text" id="tbf" name="tbf"><br><br>

  <label for="tbc">Celsius:</label>
  <input type="text" id="tbc" name="tbc"><br><br>

  <button type="button" onclick="convertirACelsius()">Convertir a Celsius</button>
  <button type="button" onclick="convertirAFahrenheit()">Convertir a Fahrenheit</button>

</body>
</html>
