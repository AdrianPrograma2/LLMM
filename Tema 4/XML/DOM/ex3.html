<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Libros XML - DOM</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 6px;
    }
    th {
      background-color: #ddd;
    }
  </style>
</head>
<body>

<h2>Datos del XML de libros</h2>
<button onclick="cargarLibros()">Cargar datos</button>

<div id="resultados"></div>
<div id="tablaLibros"></div>

<script>
function cargarLibros() {
  const xhttp = new XMLHttpRequest();
  xhttp.onload = function() {
    const xmlDoc = this.responseXML;
    const libros = xmlDoc.getElementsByTagName("book");
    
    // Título del primer libro
    const tituloPrimerLibro = libros[0].getElementsByTagName("title")[0].textContent;
    
    // Todos los títulos
    let todosTitulos = "";
    for(let i=0; i<libros.length; i++) {
      todosTitulos += libros[i].getElementsByTagName("title")[0].textContent + "<br>";
    }
    
    // Número de atributos del cuarto libro
    const numAtributosCuartoLibro = libros[3].attributes.length;
    
    // Valores de los atributos del cuarto libro
    let valoresAtributosCuartoLibro = "";
    for(let i=0; i < libros[3].attributes.length; i++) {
      valoresAtributosCuartoLibro += libros[3].attributes[i].name + ": " + libros[3].attributes[i].value + "<br>";
    }
    
    // Número de autores del tercer libro
    const autoresTercerLibro = libros[2].getElementsByTagName("author");
    const numAutoresTercerLibro = autoresTercerLibro.length;
    
    // Autores del tercer libro
    let autoresTercerLibroStr = "";
    for(let i=0; i < autoresTercerLibro.length; i++) {
      autoresTercerLibroStr += autoresTercerLibro[i].textContent + "<br>";
    }
    
    // Mostrar resultados
    let resultadosHTML = `
      <strong>Título del primer libro:</strong> ${tituloPrimerLibro} <br><br>
      <strong>Todos los títulos:</strong><br> ${todosTitulos} <br>
      <strong>Número de atributos del cuarto libro:</strong> ${numAtributosCuartoLibro} <br><br>
      <strong>Valores de atributos del cuarto libro:</strong><br> ${valoresAtributosCuartoLibro} <br>
      <strong>Número de autores del tercer libro:</strong> ${numAutoresTercerLibro} <br><br>
      <strong>Autores del tercer libro:</strong><br> ${autoresTercerLibroStr}
    `;
    document.getElementById("resultados").innerHTML = resultadosHTML;

    // Crear tabla con título, primer autor, precio y año
    let tablaHTML = `<table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Primer autor</th>
          <th>Precio</th>
          <th>Año</th>
        </tr>
      </thead>
      <tbody>`;
    
    for(let i=0; i<libros.length; i++) {
      const title = libros[i].getElementsByTagName("title")[0].textContent;
      const primerAutor = libros[i].getElementsByTagName("author")[0].textContent;
      const price = libros[i].getElementsByTagName("price")[0].textContent;
      const year = libros[i].getElementsByTagName("year")[0].textContent;
      tablaHTML += `
        <tr>
          <td>${title}</td>
          <td>${primerAutor}</td>
          <td>${price} €</td>
          <td>${year}</td>
        </tr>`;
    }
    
    tablaHTML += "</tbody></table>";
    document.getElementById("tablaLibros").innerHTML = tablaHTML;
  };

  xhttp.open("GET", "https://www.w3schools.com/xml/books.xml", true);
  xhttp.send();
}
</script>

</body>
</html>
